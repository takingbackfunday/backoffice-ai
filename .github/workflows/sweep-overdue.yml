name: Sweep overdue invoices

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sweep endpoint
        run: |
          curl -sf -X POST \
            -H "x-cron-secret: ${{ secrets.INTERNAL_CRON_SECRET }}" \
            "https://backoffice.cv/api/internal/sweep-overdue" \
            || echo "Sweep endpoint returned non-200 (may be cold start)"
