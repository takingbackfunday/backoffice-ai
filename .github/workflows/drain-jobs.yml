name: Drain background jobs

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger drain endpoint
        run: |
          curl -sf -X POST \
            -H "x-cron-secret: ${{ secrets.INTERNAL_CRON_SECRET }}" \
            "https://backoffice.cv/api/internal/drain-jobs" \
            || echo "Drain endpoint returned non-200 (may be cold start)"
