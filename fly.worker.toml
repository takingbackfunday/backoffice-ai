app = 'backoffice-ai-worker'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = 300

[build]
  dockerfile = 'Dockerfile.worker'

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[[restart]]
  policy = 'on-failure'
  retries = 3

[checks]
  [checks.health]
    port = 8081
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
